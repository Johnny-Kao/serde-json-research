name: Format research files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/i128-u128-no-string
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/de.rs tests/research_integer128.rs examples/research_integer128_bench.rs examples/research_integer128_diff.rs
          if ! git diff --cached --quiet; then
            git commit -m "Format research patch and validation harness"
            git push origin HEAD:research/i128-u128-no-string
          fi
