name: Research 128-bit parser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Baseline diagnostics preflight
        run: |
          git worktree add /tmp/serde-baseline origin/master
          mkdir -p /tmp/serde-baseline/tests
          cp tests/research_integer128.rs /tmp/serde-baseline/tests/
          cargo test --manifest-path /tmp/serde-baseline/Cargo.toml --test research_integer128 integer128_error_positions_and_input_sources -- --nocapture
      - name: Cargo tests
        run: cargo test
      - name: Feature tests
        run: cargo test --lib --features arbitrary_precision,float_roundtrip
      - name: MSRV compatible check
        run: cargo check --no-default-features --features alloc
      - name: Exact baseline differential across inputs and readers
        run: |
          mkdir -p /tmp/serde-baseline/examples
          cp examples/research_integer128_diff.rs /tmp/serde-baseline/examples/
          cargo run --release --example research_integer128_diff --manifest-path /tmp/serde-baseline/Cargo.toml --quiet > /tmp/baseline-results.txt
          cargo run --release --example research_integer128_diff --quiet > /tmp/candidate-results.txt
          wc -l /tmp/baseline-results.txt /tmp/candidate-results.txt
          diff -u /tmp/baseline-results.txt /tmp/candidate-results.txt
      - name: Prepare baseline and release binaries
        run: |
          mkdir -p /tmp/serde-baseline/examples
          cp examples/research_integer128_bench.rs /tmp/serde-baseline/examples/
          cargo build --release --example research_integer128_bench
          cargo build --release --example research_integer128_bench --manifest-path /tmp/serde-baseline/Cargo.toml
      - name: Runner environment
        run: |
          uname -a
          lscpu | grep -E 'Model name|CPU\(s\)|Architecture|Thread|Socket|MHz' || true
          free -m
          rustc --version
          git rev-parse HEAD
          git -C /tmp/serde-baseline rev-parse HEAD
      - name: Repeated paired A/B with unaffected u64 control
        run: |
          set -eu
          for round in 1 2 3 4 5 6; do
            if [ $((round % 2)) -eq 1 ]; then
              order="baseline candidate candidate baseline"
            else
              order="candidate baseline baseline candidate"
            fi
            for variant in $order; do
              echo "BEGIN_PAIR round=$round variant=$variant"
              if [ "$variant" = baseline ]; then
                /tmp/serde-baseline/target/release/examples/research_integer128_bench
              else
                target/release/examples/research_integer128_bench
              fi
              echo "END_PAIR round=$round variant=$variant"
            done
          done


  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.71.0
      - run: cargo +1.71.0 check --no-default-features --features alloc
      - run: cargo +1.71.0 check --features arbitrary_precision
      - name: MSRV regression build (no dev-dependency resolution)
        run: cargo +1.71.0 check --lib --no-default-features --features alloc,arbitrary_precision
